name: Build Mod

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 解压源代码压缩包
        run: |
          ZIP_FILE=$(ls *.zip 2>/dev/null | head -n 1)
          if [ -f "$ZIP_FILE" ]; then
            echo "找到压缩包：$ZIP_FILE，正在解压..."
            unzip -o "$ZIP_FILE"
            rm "$ZIP_FILE"
            echo "解压完成"
            ls -la
          else
            echo "没有找到 .zip 文件"
          fi

      - name: 修复 build.gradle（使用稳定版 fabric-loom）
        run: |
          cat > build.gradle <<'EOF'
          plugins {
              id 'fabric-loom' version '1.7.4'
              id 'maven-publish'
          }
          version = "1.0.0"
          group = "com.example"
          archivesBaseName = "sbx_frag_7"
          repositories { mavenCentral() }
          dependencies {
              minecraft "com.mojang:minecraft:1.21.1"
              mappings loom.officialMojangMappings()
              modImplementation "net.fabricmc:fabric-loader:0.15.11"
              modImplementation "net.fabricmc.fabric-api:fabric-api:0.100.4+1.21.1"
          }
          loom { splitEnvironmentSourceSets() }
          EOF
          echo "✅ build.gradle 已修复"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Build with Gradle
        run: gradle build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbx_frag_7
          path: build/libs/*.jar
