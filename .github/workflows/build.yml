name: Build Mod

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 解压源代码压缩包
        run: |
          # 查找仓库里所有 .zip 文件（通常是你上传的那个）
          ZIP_FILE=$(ls *.zip 2>/dev/null | head -n 1)
          if [ -f "$ZIP_FILE" ]; then
            echo "找到压缩包：$ZIP_FILE，正在解压..."
            unzip -o "$ZIP_FILE"
            rm "$ZIP_FILE"
            echo "解压完成，当前目录内容："
            ls -la
          else
            echo "没有找到 .zip 文件，跳过解压步骤。"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build with Gradle
        run: gradle build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbx_frag_7
          path: build/libs/*.jar
