name: Build Mod

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 解压源代码压缩包
        run: |
          ZIP_FILE=$(ls *.zip 2>/dev/null | head -n 1)
          if [ -f "$ZIP_FILE" ]; then
            echo "找到压缩包：$ZIP_FILE，正在解压..."
            unzip -o "$ZIP_FILE"
            rm "$ZIP_FILE"
            echo "解压完成，当前目录内容："
            ls -la
          else
            echo "没有找到 .zip 文件，跳过解压步骤。"
          fi

      - name: 修复 build.gradle 和 fabric.mod.json
        run: |
          # 修复 build.gradle（去掉不支持的 client 块）
          cat > build.gradle <<'EOF'
          plugins {
              id 'fabric-loom' version '1.7.4'
              id 'maven-publish'
          }
          version = "1.0.0"
          group = "com.example"
          archivesBaseName = "sbx_frag_7"
          repositories { 
              mavenCentral()
              maven { url 'https://maven.fabricmc.net/' }
          }
          dependencies {
              minecraft "com.mojang:minecraft:1.21.1"
              mappings loom.officialMojangMappings()
              modImplementation "net.fabricmc:fabric-loader:0.15.11"
          }
          loom {
              splitEnvironmentSourceSets()
          }
          EOF

          # 修复 fabric.mod.json（强制指定 client 环境）
          cat > src/main/resources/fabric.mod.json <<'EOF'
          {
            "schemaVersion": 1,
            "id": "sbx_frag_7",
            "version": "1.0.0",
            "name": "<SBX://PROJ.FRAG-7/ACCESS:Ω>",
            "description": "铁砧命名改变纹理",
            "authors": ["You"],
            "license": "MIT",
            "environment": "client",
            "entrypoints": {
              "main": ["com.example.namedobsidian.NamedObsidianMod"],
              "client": ["com.example.namedobsidian.NamedObsidianClient"]
            },
            "mixins": ["namedobsidian.mixins.json"],
            "depends": {
              "fabricloader": ">=0.15.0",
              "minecraft": "~1.21.1"
            }
          }
          EOF

          echo "✅ 所有配置文件已修复"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle 8.8
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.8

      - name: Build with Gradle
        run: gradle build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbx_frag_7
          path: build/libs/*.jar
